// --- Drive
const dFile=(f,i)=>`<div class="li" style="cursor:default"><div class="g"><b style="font-size:13.5px">${esc(f.name)}</b><p class="s">${esc((f.mimeType||'').replace('application/vnd.google-apps.','Google ').replace('application/',''))}</p></div><button class="btn o sm" onclick="driveGo(${i},this)">Importar</button></div>`;
async function driveList(q){const m="(mimeType='application/pdf' or mimeType contains 'image/' or mimeType='text/plain' or mimeType='application/vnd.google-apps.document' or mimeType='application/vnd.google-apps.presentation' or mimeType='application/vnd.google-apps.spreadsheet')",qq=['trashed=false',m];if(q)qq.push("name contains '"+q.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'");
 return(await gf('https://www.googleapis.com/drive/v3/files?pageSize=25&orderBy='+encodeURIComponent('modifiedTime desc')+'&fields='+encodeURIComponent('files(id,name,mimeType,size,modifiedTime)')+'&q='+encodeURIComponent(qq.join(' and '))))
 .files||[]}
function driveSheet(){gOpen('Importar desde Drive',async()=>{DR.files=await driveList('');return`${subSel('gs')}<div class="row" style="margin-bottom:10px"><input id="gq" style="margin:0" placeholder="Buscar por nombre" onkeydown="if(event.key==='Enter')driveFind()"><button class="ib" onclick="driveFind()" aria-label="Buscar">${ic('arrow',16)}</button></div><div id="gl">${DR.files.map(dFile).join('')||'<p class="s">No encontré archivos compatibles.</p>'}</div>`})}
async function driveFind(){const gl=$('#gl');gl.innerHTML='<p class="s">Buscando…</p>';try{DR.files=await driveList($('#gq').value.trim());gl.innerHTML=DR.files.map(dFile).join('')||'<p class="s">Sin resultados.</p>'}catch(e){gl.innerHTML='<p style="font-weight:700">'+esc(errTxt(e)[0])+'</p>'}}
async function driveGo(i,btn){const f=DR.files[i],sid=$('#gs').value;btn.disabled=true;btn.textContent='Importando…';try{await driveImport(f,sid);btn.textContent='Listo';render();toast('Fuente importada')}catch(e){btn.disabled=false;btn.textContent='Importar';toast(errTxt(e)[0].slice(0,60))}}
async function driveImport(f,sid){if(S.lib.some(x=>x.drive===f.id&&x.sid===sid))return;const mt=f.mimeType,id=f.id;
 if(mt.startsWith('application/vnd.google-apps.')){const r=await gf('https://www.googleapis.com/drive/v3/files/'+id+'/export?mimeType='+encodeURIComponent(mt.endsWith('spreadsheet')?'text/csv':'text/plain'),{raw:1}),t=await r.text();if(!t.trim())throw new Error('El documento está vacío.');S.lib.push({id:uid(),sid,kind:'Drive',title:f.name,body:t.slice(0,200000),drive:id})}
 else{const r=await gf('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',{raw:1}),bl=await r.blob();if(bl.size>15e6)throw new Error('El archivo pesa más de 15 MB.');const nid=uid();if(mt==='text/plain')S.lib.push({id:nid,sid,kind:'Drive',title:f.name,body:(await bl.text()).slice(0,200000),drive:id});else{await IDB.put(nid,new Blob([bl],{type:mt}));S.lib.push({id:nid,sid,kind:mt==='application/pdf'?'PDF':'Imagen',title:f.name,body:'',file:{mime:mt,size:bl.size},drive:id})}}save()}
// --- Classroom
const dd2=d=>d&&d.year?`${d.year}-${pad(d.month)}-${pad(d.day)}`:'';
function clsSheet(){gOpen('Google Classroom',async()=>{DR.courses=(await gf('https://classroom.googleapis.com/v1/courses?courseStates=ACTIVE&pageSize=20')).courses||[];return`${subSel('gs')}${DR.courses.map((c,i)=>`<div class="li" style="cursor:default"><div class="g"><b style="font-size:14px">${esc(c.name)}</b><p class="s">${esc(c.section||c.descriptionHeading||'')}</p></div><button class="btn o sm" onclick="clsGo(${i},this)">Importar</button></div>`).join('')||'<p class="s">No encontré cursos activos.</p>'}<div id="gl"></div>`})}
async function clsGo(i,btn){const c=DR.courses[i],sid=$('#gs').value;btn.disabled=true;btn.textContent='Importando…';try{const cw=(await gf('https://classroom.googleapis.com/v1/courses/'+c.id+'/courseWork?pageSize=30')).courseWork||[],cm=(await gf('https://classroom.googleapis.com/v1/courses/'+c.id+'/courseWorkMaterials?pageSize=30')).courseWorkMaterial||[];let n=0;
 for(const it of [...cw,...cm]){if(it.description&&it.description.trim().length>20&&!S.lib.some(x=>x.sid===sid&&x.title==='Classroom · '+it.title)){S.lib.push({id:uid(),sid,kind:'Apuntes',title:'Classroom · '+it.title,body:it.description});n++}
  for(const m of it.materials||[]){const df=m.driveFile&&m.driveFile.driveFile;if(df&&!S.lib.some(x=>x.drive===df.id&&x.sid===sid)){try{const meta=await gf('https://www.googleapis.com/drive/v3/files/'+df.id+'?fields=id,name,mimeType');await driveImport(meta,sid);n++}catch(e){}}const yv=m.youtubeVideo;if(yv&&yv.alternateLink&&!S.lib.some(x=>x.body===yv.alternateLink&&x.sid===sid)){S.lib.push({id:uid(),sid,kind:'Video',title:yv.title||'Video de Classroom',body:yv.alternateLink});n++}}}
 save();render();btn.textContent='Listo';const due=cw.filter(x=>x.dueDate).map(x=>({t:x.title,d:dd2(x.dueDate)})).filter(x=>dd(iso(),x.d)>=0).sort((a,b)=>a.d.localeCompare(b.d));DR.due=due;DR.dsid=sid;
 $('#gl').innerHTML=`<p style="font-weight:700;margin:10px 0">${n} fuentes nuevas importadas.</p>${due.length?'<p class="s">Próximas entregas:</p>'+due.slice(0,8).map((x,k)=>`<div class="li" style="cursor:default"><div class="g"><b style="font-size:13.5px">${esc(x.t)}</b><p class="s">${x.d}</p></div><button class="btn o sm" onclick="useExam(DR.dsid,DR.due[${k}].d)">Usar como examen</button></div>`).join(''):''}`}catch(e){btn.disabled=false;btn.textContent='Importar';$('#gl').innerHTML='<p style="font-weight:700;margin-top:10px">'+esc(errTxt(e)[0])+'</p>'}}
function useExam(sid,d){const s=sub(sid);if(!s||!d)return;s.exam=d;save();render();toast('Examen de '+s.name+': '+d)}
// --- Calendar
const ACAD=/examen|parcial|quiz|prueba|entrega|evaluaci|taller|exam|final|sustentaci/i;
function calSheet(){gOpen('Mis fechas en Google Calendar',async()=>{const a=new Date(),b=new Date();b.setDate(b.getDate()+60);const j=await gf('https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=60&timeMin='+encodeURIComponent(a.toISOString())+'&timeMax='+encodeURIComponent(b.toISOString()));
 DR.ev=(j.items||[]).filter(e=>ACAD.test(e.summary||'')).map(e=>({t:e.summary,d:((e.start&&(e.start.date||e.start.dateTime))||'').slice(0,10)})).filter(e=>e.d);
 return`${subSel('gs')}${DR.ev.length?DR.ev.map((e,i)=>`<div class="li" style="cursor:default"><div class="g"><b style="font-size:13.5px">${esc(e.t)}</b><p class="s">${e.d}</p></div><button class="btn o sm" onclick="useExam($('#gs').value,DR.ev[${i}].d)">Usar como examen</button></div>`).join(''):'<p class="s">No encontré eventos con palabras como examen, parcial, quiz o entrega en los próximos 60 días.</p>'}`})}
async function gPlanPush(){const p=plan();if(!p.length){toast('Aún no hay plan para hoy');return}
 try{if(!gOk())await gConnect();let h=18,m=0;const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;for(const x of p){const st=`${iso()}T${pad(h)}:${pad(m)}:00`;m+=x.min;h+=Math.floor(m/60);m%=60;const en=`${iso()}T${pad(h)}:${pad(m)}:00`;
  await gf('https://www.googleapis.com/calendar/v3/calendars/primary/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({summary:'Estudiar: '+x.s.name+' · '+x.t.name,description:x.why,start:{dateTime:st,timeZone:tz},end:{dateTime:en,timeZone:tz}})})}
  toast(p.length+' sesiones enviadas a tu calendario (desde las 18:00)')}catch(e){gErr(e)}}
// --- Gmail
function mailSheet(){gOpen('Avisos académicos en Gmail',async()=>{const q='newer_than:30d (examen OR parcial OR quiz OR evaluación OR entrega OR taller OR "fecha de")',l=(await gf('https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=8&q='+encodeURIComponent(q))).messages||[];
 DR.mail=await Promise.all(l.map(async m=>{const j=await gf('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+m.id+'?format=metadata&metadataHeaders=Subject&metadataHeaders=From&metadataHeaders=Date'),h=n=>((j.payload.headers||[]).find(x=>x.name===n)||{}).value||'';return{id:m.id,s:h('Subject'),f:h('From'),sn:j.snippet||''}}));
 return`<p class="s" style="margin:0 0 10px">Solo envío a Brote el asunto y el fragmento del correo que elijas analizar.</p>${subSel('gs')}${DR.mail.map((m,i)=>`<div class="card" style="margin-bottom:10px"><b style="font-size:14px">${esc(m.s||'(sin asunto)')}</b><p class="s">${esc(m.f)}</p><p class="s" style="color:var(--ink)">${esc(m.sn.slice(0,140))}</p><div id="mr${i}"></div><button class="btn o sm" style="margin-top:8px" onclick="mailAn(${i},this)">Analizar con Brote</button></div>`).join('')||'<p class="s">No encontré avisos recientes.</p>'}`})}
async function mailAn(i,btn){const m=DR.mail[i],o=$('#mr'+i);btn.disabled=true;o.innerHTML='<p class="s">Brote está leyendo…</p>';try{const r=parseJ(await gem([{text:`Correo recibido por una estudiante.\nAsunto: ${m.s}\nDe: ${m.f}\nFragmento: ${m.sn}\nHoy es ${iso()}. Decide si anuncia un examen, entrega o evaluación. Devuelve SOLO JSON: {"academico":true,"resumen":"una frase","fecha":"YYYY-MM-DD o null"}`}],'Eres Brote. Responde en español y solo con lo que dice el correo; no inventes fechas.',true));
 o.innerHTML=`<p style="margin:6px 0 0;font-weight:700">${esc(r.resumen||'')}</p>${r.fecha&&/^\d{4}-\d{2}-\d{2}$/.test(r.fecha)?`<button class="btn sm" style="margin-top:6px" onclick="useExam($('#gs').value,'${r.fecha}')">Usar ${r.fecha} como examen<i>${ic('check',13,2.8)}</i></button>`:'<p class="s">No encontré una fecha clara.</p>'}`}catch(e){o.innerHTML='<p style="font-weight:700;margin-top:6px">'+esc(errTxt(e)[0])+'</p>'}btn.disabled=false}
// --- YouTube
const YTR={};
function ytCard(s,t){const r=YTR[t.id];let b;
 if(r&&r.busy)b=loadH('Buscando videos…');
 else if(r&&r.list)b=r.list.map((v,i)=>`<div class="li" style="cursor:default;align-items:flex-start"><img src="${esc(v.th)}" alt="" width="96" height="54" style="border-radius:12px;flex:none;object-fit:cover"><div class="g"><b style="font-size:13.5px">${esc(v.title)}</b><p class="s">${esc(v.ch)}</p>${v.why?`<p class="s" style="color:var(--ink)">${esc(v.why)}</p>`:''}<div class="row" style="gap:8px;margin-top:6px;flex-wrap:wrap"><a class="btn o sm" style="text-decoration:none;padding:6px 14px" href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener">Ver</a><button class="btn o sm" onclick="ytAdd('${s.id}','${t.id}',${i})">Usar como fuente</button></div></div></div>`).join('');
 else if(r&&r.link)b=`<p class="s" style="margin-bottom:10px">${r.err?esc(r.err)+' ':''}Con una llave gratis de YouTube (en Conexiones) Brote te muestra aquí los mejores videos.</p><a class="btn" style="text-decoration:none" href="${esc(r.link)}" target="_blank" rel="noopener">Buscar en YouTube<i>${ic('arrow',15,2.6)}</i></a>`;
 else b=`<p class="s" style="margin-bottom:10px">Brote busca videos de YouTube para reforzar «${esc(t.name)}».</p><button class="btn" onclick="ytFind('${s.id}','${t.id}')">Buscar videos<i>${ic('arrow',15,2.6)}</i></button>`;
 return`<div class="card"><h3 style="margin-bottom:10px">Videos para reforzar</h3>${b}</div>`}
async function ytFind(sid,tid){const s=sub(sid),t=s.topics.find(x=>x.id===tid),q=t.name+' '+s.name+' explicación',link='https://www.youtube.com/results?search_query='+encodeURIComponent(q);
 if(!S.set.ytk){YTR[tid]={link};render();return}YTR[tid]={busy:1};render();
 try{const r=await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=3&relevanceLanguage=es&safeSearch=strict&q='+encodeURIComponent(q)+'&key='+encodeURIComponent(S.set.ytk)),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||('YouTube respondió '+r.status));
  const dec=x=>{const e=document.createElement('textarea');e.innerHTML=x;return e.value},list=(j.items||[]).filter(v=>v.id&&v.id.videoId).map(v=>({id:v.id.videoId,title:dec(v.snippet.title),ch:dec(v.snippet.channelTitle),th:(v.snippet.thumbnails.medium||v.snippet.thumbnails.default).url}));
  if(!list.length){YTR[tid]={link,err:'No encontré videos.'};render();return}YTR[tid]={list};render();
  if(S.set.key){try{const w=parseJ(await gem([{text:`Tema: ${t.name}. Materia: ${s.name}. Conceptos que me costaron: ${(t.fails||[]).join(', ')||'ninguno registrado'}.\nVideos:\n${list.map((v,i)=>`${i+1}. ${v.title} (${v.ch})`).join('\n')}\nPara cada video escribe una frase corta de por qué sirve para reforzar este tema. Devuelve SOLO JSON: {"why":["","",""]}`}],'Eres Brote, una profesora particular. Responde en español.',true)).why;list.forEach((v,i)=>v.why=String((w&&w[i])||''));render()}catch(e){}}}
 catch(e){YTR[tid]={link,err:e.message};render()}}
function ytAdd(sid,tid,i){const v=YTR[tid].list[i],u='https://www.youtube.com/watch?v='+v.id;if(S.lib.some(x=>x.sid===sid&&x.body===u)){toast('Ya está en tu Biblioteca');return}S.lib.push({id:uid(),sid,kind:'Video',title:v.title,body:u});save();toast('Video añadido como fuente')}

function hiBrote(el){const P=[`¡Hola, ${S.name}!`,'Un tema a la vez y llegas lejos.','Hoy puedes con esto.',`Llevas ${streak()} ${streak()===1?'día':'días'} de racha.`,'Repasar un poquito cada día funciona.','¡Vamos a estudiar un ratito!'];const sv=el.querySelector('svg');if(sv){sv.classList.remove('jump');void sv.getBoundingClientRect();sv.classList.add('jump')}toast(P[Math.floor(Math.random()*P.length)])}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=document.createElement('canvas');c.className='conf';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext('2d'),C=['#FFE59A','#FFB5C1','#B7E1D1','#A9D3FF','#D9CBFF'],P=[...Array(46)].map(()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.55,vx:(Math.random()-.5)*9,vy:-Math.random()*11-4,r:Math.random()*6+4,c:C[Math.floor(Math.random()*5)],a:Math.random()*6,va:(Math.random()-.5)*.4}));let f=0;
 (function t(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.strokeStyle='#1D2230';x.lineWidth=1.5;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.strokeRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++f<80)requestAnimationFrame(t);else c.remove()})()}
bootAuth();
render();
</script></body></html>
