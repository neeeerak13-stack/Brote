name: Construir Brote

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: brote-build
  cancel-in-progress: true

env:
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

jobs:
  apk:
    name: Crear el APK
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Ordenar los archivos en carpetas
        run: |
          mkdir -p docs assets scripts keystore
          for f in index.html oauth.html config.js manifest.webmanifest sw.js icon-192.png icon-512.png; do [ -f "$f" ] && [ ! -f "docs/$f" ] && mv "$f" docs/ || true; done
          for f in icon-only.png icon-foreground.png icon-background.png splash.png; do [ -f "$f" ] && [ ! -f "assets/$f" ] && mv "$f" assets/ || true; done
          [ -f patch-android.py ] && [ ! -f scripts/patch-android.py ] && mv patch-android.py scripts/ || true
          [ -f brote.keystore ] && [ ! -f keystore/brote.keystore ] && mv brote.keystore keystore/ || true
          ls -R docs assets scripts keystore

      - name: Configurar la dirección de la página y el Client ID
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          REPO="${GITHUB_REPOSITORY#*/}"
          printf 'window.BROTE_CONFIG={pages:"https://%s.github.io/%s",clientId:"%s"};\n' "$OWNER" "$REPO" "$GOOGLE_CLIENT_ID" > docs/config.js
          cat docs/config.js

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Generar íconos y pantalla de inicio
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Ajustar enlace de Google, firma y versión
        run: python3 scripts/patch-android.py
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Copiar la app al proyecto
        run: npx cap sync android

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar el archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Brote.apk

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Brote-apk
          path: Brote.apk

      - name: Publicar el APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Brote ${{ github.run_number }}
          body: "Descarga Brote.apk e instálalo en tu celular Android."
          files: Brote.apk
          make_latest: true

  pages:
    name: Publicar la página web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Ordenar los archivos en carpetas
        run: |
          mkdir -p docs assets scripts keystore
          for f in index.html oauth.html config.js manifest.webmanifest sw.js icon-192.png icon-512.png; do [ -f "$f" ] && [ ! -f "docs/$f" ] && mv "$f" docs/ || true; done
          for f in icon-only.png icon-foreground.png icon-background.png splash.png; do [ -f "$f" ] && [ ! -f "assets/$f" ] && mv "$f" assets/ || true; done
          [ -f patch-android.py ] && [ ! -f scripts/patch-android.py ] && mv patch-android.py scripts/ || true
          [ -f brote.keystore ] && [ ! -f keystore/brote.keystore ] && mv brote.keystore keystore/ || true
          ls -R docs assets scripts keystore

      - name: Configurar la dirección de la página y el Client ID
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          REPO="${GITHUB_REPOSITORY#*/}"
          printf 'window.BROTE_CONFIG={pages:"https://%s.github.io/%s",clientId:"%s"};\n' "$OWNER" "$REPO" "$GOOGLE_CLIENT_ID" > docs/config.js

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir la página
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
