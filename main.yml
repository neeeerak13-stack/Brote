name: Construir Brote

on:
  push:
    branches: [main, principal]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: brote-build
  cancel-in-progress: true

env:
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

jobs:
  apk:
    name: Crear el APK
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar recursos web completos de Aurora y Orbe
        run: python3 scripts/prepare-web.py

      - name: Configurar Pages y Google Client ID
        shell: bash
        run: |
          set -euo pipefail
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          REPO="${GITHUB_REPOSITORY#*/}"
          printf 'window.BROTE_CONFIG={pages:"https://%s.github.io/%s",clientId:"%s"};\\n' "$OWNER" "$REPO" "$GOOGLE_CLIENT_ID" > docs/config.js
          test -s docs/config.js

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Ejecutar pruebas de regresión de Aurora y Orbe
        run: npm test

      - name: Validar sintaxis JavaScript empaquetado
        run: |
          set -euo pipefail
          for f in docs/js/*.js; do node --check "$f"; done

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Generar iconos Android
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Ajustar OAuth, permisos, firma debug y versión
        run: python3 scripts/patch-android.py
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Sincronizar recursos web con Android
        run: npx cap sync android

      - name: Verificar recursos Orbe dentro de Android
        run: |
          set -euo pipefail
          PUBLIC="android/app/src/main/assets/public"
          test -s "$PUBLIC/index.html"
          test -s "$PUBLIC/orbe.html"
          test -s "$PUBLIC/css/aurora-ui.css"
          test -s "$PUBLIC/logo-unal.png"
          for f in aurora-academic-core.js aurora-academic-adapter.js aurora-academic-services.js aurora-history-import.js aurora-legacy-bridge.js aurora-orbe-assistant.js aurora-orbe-ui.js; do
            test -s "$PUBLIC/js/$f"
          done
          echo "OK: HTML, CSS, logo y los 7 módulos de Orbe están empaquetados."

      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verificar APK y contenido de Orbe
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/public/orbe.html'
          unzip -l "$APK" | grep -q 'assets/public/css/aurora-ui.css'
          unzip -l "$APK" | grep -q 'assets/public/js/aurora-orbe-ui.js'
          mkdir -p dist
          cp "$APK" dist/Brote.apk
          sha256sum dist/Brote.apk
          ls -lh dist/Brote.apk

      - name: Guardar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Brote-apk
          path: dist/Brote.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Brote ${{ github.run_number }}
          body: 'APK debug de Brote/Aurora con recursos de Orbe comprobados.'
          files: dist/Brote.apk
          make_latest: true

  pages:
    name: Publicar la página web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar recursos web completos
        run: python3 scripts/prepare-web.py

      - name: Configurar Pages y Google Client ID
        shell: bash
        run: |
          set -euo pipefail
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          REPO="${GITHUB_REPOSITORY#*/}"
          printf 'window.BROTE_CONFIG={pages:"https://%s.github.io/%s",clientId:"%s"};\\n' "$OWNER" "$REPO" "$GOOGLE_CLIENT_ID" > docs/config.js
          test -s docs/config.js

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar sitio
        id: deploy
        uses: actions/deploy-pages@v4
